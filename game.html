<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird — Mini Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #gameCanvas{display:block;border-radius:4px;cursor:pointer;image-rendering:pixelated;}
  .ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff;text-align:center;}
  .ui.active{pointer-events:all;}
  .overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);flex-direction:column;align-items:center;justify-content:center;pointer-events:all;}
  .overlay.active{display:flex;}
  .overlay h1{font-size:42px;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,0.5);}
  .overlay p{font-size:16px;margin-bottom:6px;opacity:0.85;}
  .overlay .final-score{font-size:64px;font-weight:700;margin:12px 0;text-shadow:0 3px 12px rgba(0,0,0,0.5);}
  .overlay .best{font-size:14px;opacity:0.7;margin-bottom:20px;}
  .btn{margin-top:14px;padding:12px 36px;font-size:16px;background:#76be44;color:#fff;border:none;border-radius:24px;cursor:pointer;font-weight:600;box-shadow:0 4px 0 #5a9430;transition:transform .1s,box-shadow .1s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a9430;}
  .btn-small{padding:8px 20px;font-size:13px;background:#555;box-shadow:0 3px 0 #333;}
  .btn-small:active{box-shadow:0 1px 0 #333;}
  .controls-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;opacity:0.5;color:#fff;}
  .music-toggle{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:13px;pointer-events:all;backdrop-filter:blur(4px);}
  .music-toggle:hover{background:rgba(255,255,255,0.35);}
  .score-display{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:40px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.4);display:none;}
</style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div class="score-display" id="scoreDisplay">0</div>

<button class="music-toggle" id="musicToggle">&#9835; Music: ON</button>

<div class="controls-hint">Press SPACE or TAP to fly</div>

<div class="overlay active" id="startScreen">
  <h1>Flappy Bird</h1>
  <p>Avoid the pipes. Stay alive.</p>
  <button class="btn" id="startBtn">Start Game</button>
</div>

<div class="overlay" id="gameOverScreen">
  <h1>Game Over</h1>
  <div class="final-score" id="finalScore">0</div>
  <div class="best" id="bestScore">Best: 0</div>
  <button class="btn" id="restartBtn">Try Again</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const musicToggle = document.getElementById('musicToggle');

const W = canvas.width;
const H = canvas.height;
const GRAVITY = 0.45;
const JUMP = -7.5;
const PIPE_WIDTH = 52;
const PIPE_GAP = 140;
const PIPE_SPEED = 2.5;
const PIPE_SPAWN_INTERVAL = 100;
const GROUND_H = 60;
const PLAYGROUND_H = H - GROUND_H;

let bird, pipes, score, bestScore, gameRunning, gameOver, frameCount, pipeTimer;
let framesSincePipe = 0;

bestScore = parseInt(localStorage.getItem('flappyBest') || '0');

/* ===== AUDIO ENGINE ===== */
let audioCtx, musicPlaying, musicGain, bgOscillators, musicNodes;
let jumpSound, scoreSound, hitSound;
let audioInitialized = false;

function initAudio() {
  if (audioInitialized) return;
  audioInitialized = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  /* Jump sound: short rising chirp */
  function createJumpSound() {
    return function() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    };
  }

  /* Score sound: two quick ding tones */
  function createScoreSound() {
    return function() {
      if (!audioCtx) return;
      [880, 1320].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.08;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      });
    };
  }

  /* Hit sound: harsh descending noise */
  function createHitSound() {
    return function() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      source.connect(gain).connect(audioCtx.destination);
      source.start();
    };
  }

  jumpSound = createJumpSound();
  scoreSound = createScoreSound();
  hitSound = createHitSound();
}

/* Background music: simple procedural melody with bass and harmony */
function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.08;
  musicGain.connect(audioCtx.destination);

  musicNodes = [];

  /* Bass line notes (C minor progression) */
  const bassNotes = [130.81, 110.00, 146.83, 98.00];
  /* Melody notes */
  const melodyNotes = [523.25, 622.25, 698.46, 784.00, 698.46, 523.25, 440.00, 523.25, 587.33, 698.46, 587.33, 523.25];
  /* Harmony notes */
  const harmonyNotes = [329.63, 369.99, 392.00, 349.23];

  let beatIndex = 0;
  const tempo = 0.36; /* seconds per beat */

  function scheduleNotes() {
    if (!musicPlaying) return;

    const now = audioCtx.currentTime;

    /* Schedule bass */
    const bassFreq = bassNotes[beatIndex % bassNotes.length];
    const bassOsc = audioCtx.createOscillator();
    const bassEnv = audioCtx.createGain();
    bassOsc.type = 'triangle';
    bassOsc.frequency.value = bassFreq;
    bassEnv.gain.setValueAtTime(0, now);
    bassEnv.gain.linearRampToValueAtTime(1, now + 0.02);
    bassEnv.gain.setValueAtTime(1, now + tempo * 0.8);
    bassEnv.gain.linearRampToValueAtTime(0, now + tempo * 0.95);
    bassOsc.connect(bassEnv).connect(musicGain);
    bassOsc.start(now);
    bassOsc.stop(now + tempo);
    musicNodes.push(bassOsc);

    /* Schedule melody every 2 beats */
    if (beatIndex % 2 === 0) {
      const melIdx = (beatIndex / 2) % melodyNotes.length;
      const melFreq = melodyNotes[melIdx];
      const melOsc = audioCtx.createOscillator();
      const melEnv = audioCtx.createGain();
      melOsc.type = 'square';
      melOsc.frequency.value = melFreq;
      const melGain = audioCtx.createGain();
      melGain.gain.value = 0.3;
      melEnv.gain.setValueAtTime(0, now);
      melEnv.gain.linearRampToValueAtTime(1, now + 0.01);
      melEnv.gain.setValueAtTime(1, now + tempo * 0.6);
      melEnv.gain.linearRampToValueAtTime(0, now + tempo * 0.8);
      melOsc.connect(melGain).connect(melEnv).connect(musicGain);
      melOsc.start(now);
      melOsc.stop(now + tempo);
      musicNodes.push(melOsc);
    }

    /* Schedule harmony every 4 beats */
    if (beatIndex % 4 === 0) {
      const harIdx = (beatIndex / 4) % harmonyNotes.length;
      const harFreq = harmonyNotes[harIdx];
      const harOsc = audioCtx.createOscillator();
      const harEnv = audioCtx.createGain();
      harOsc.type = 'sine';
      harOsc.frequency.value = harFreq;
      harEnv.gain.setValueAtTime(0, now);
      harEnv.gain.linearRampToValueAtTime(0.6, now + 0.03);
      harEnv.gain.setValueAtTime(0.6, now + tempo * 1.5);
      harEnv.gain.linearRampToValueAtTime(0, now + tempo * 2);
      harOsc.connect(harEnv).connect(musicGain);
      harOsc.start(now);
      harOsc.stop(now + tempo * 2);
      musicNodes.push(harOsc);
    }

    beatIndex++;
    setTimeout(scheduleNotes, tempo * 1000);
  }

  scheduleNotes();
}

function stopMusic() {
  musicPlaying = false;
  if (musicGain) {
    try { musicGain.disconnect(); } catch(e) {}
  }
  musicNodes = [];
}

/* ===== IMAGES / SPRITES (Canvas-drawn) ===== */

function drawBackground() {
  /* Sky gradient */
  const grad = ctx.createLinearGradient(0, 0, 0, PLAYGROUND_H);
  grad.addColorStop(0, '#4ec6e8');
  grad.addColorStop(0.5, '#87ceeb');
  grad.addColorStop(1, '#b6e8f0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, PLAYGROUND_H);

  /* Distant hills */
  ctx.fillStyle = '#7db88a';
  ctx.beginPath();
  ctx.moveTo(0, PLAYGROUND_H - 40);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, PLAYGROUND_H - 40 - Math.sin(x * 0.015 + 1) * 25 - Math.sin(x * 0.03) * 10);
  }
  ctx.lineTo(W, PLAYGROUND_H);
  ctx.lineTo(0, PLAYGROUND_H);
  ctx.fill();

  /* Closer hills */
  ctx.fillStyle = '#5fa86e';
  ctx.beginPath();
  ctx.moveTo(0, PLAYGROUND_H - 20);
  for (let x = 0; x <= W; x += 15) {
    ctx.lineTo(x, PLAYGROUND_H - 20 - Math.sin(x * 0.02 + 2.5) * 18 - Math.sin(x * 0.04) * 8);
  }
  ctx.lineTo(W, PLAYGROUND_H);
  ctx.lineTo(0, PLAYGROUND_H);
  ctx.fill();

  /* Clouds */
  const cloudOffset = (frameCount * 0.3) % (W + 100);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  drawCloud(W - cloudOffset, 40, 0.8);
  drawCloud(W - cloudOffset - 180, 90, 0.6);
  drawCloud(W - cloudOffset - 360, 30, 0.5);
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.arc(25, -5, 18, 0, Math.PI * 2);
  ctx.arc(50, 0, 22, 0, Math.PI * 2);
  ctx.arc(15, 8, 14, 0, Math.PI * 2);
  ctx.arc(35, 8, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGround() {
  /* Ground */
  const groundGrad = ctx.createLinearGradient(0, PLAYGROUND_H, 0, H);
  groundGrad.addColorStop(0, '#6bbe58');
  groundGrad.addColorStop(0.15, '#5aa847');
  groundGrad.addColorStop(1, '#3d7a2f');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, PLAYGROUND_H, W, GROUND_H);

  /* Grass line */
  ctx.fillStyle = '#8ad06a';
  ctx.fillRect(0, PLAYGROUND_H, W, 6);

  /* Grass tufts */
  ctx.strokeStyle = '#6bbe58';
  ctx.lineWidth = 2;
  const grassOffset = (frameCount * 0.5) % 30;
  for (let x = -grassOffset; x < W + 20; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, PLAYGROUND_H + 6);
    ctx.lineTo(x + 3, PLAYGROUND_H - 8);
    ctx.lineTo(x + 6, PLAYGROUND_H + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 10, PLAYGROUND_H + 6);
    ctx.lineTo(x + 13, PLAYGROUND_H - 12);
    ctx.lineTo(x + 16, PLAYGROUND_H + 6);
    ctx.stroke();
  }

  /* Ground border line */
  ctx.fillStyle = '#4a8a35';
  ctx.fillRect(0, PLAYGROUND_H, W, 2);
}

function drawBird(x, y, rotation, alive) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  /* Body */
  ctx.fillStyle = '#f7dc6f';
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#c9982a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* Belly */
  ctx.fillStyle = '#fdebd0';
  ctx.beginPath();
  ctx.ellipse(3, 4, 10, 7, 0.1, 0, Math.PI * 2);
  ctx.fill();

  /* Wing */
  const wingY = Math.sin(frameCount * 0.3) * 4;
  ctx.fillStyle = '#f0c847';
  ctx.beginPath();
  ctx.ellipse(-6, wingY - 2, 9, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#c9982a';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* Eye white */
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(7, -5, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  /* Pupil */
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
  ctx.fill();

  /* Eye highlight */
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(10, -6.5, 1, 0, Math.PI * 2);
  ctx.fill();

  /* Beak */
  ctx.fillStyle = '#e67e22';
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(24, 2);
  ctx.lineTo(14, 5);
  ctx.fill();
  ctx.strokeStyle = '#c0650a';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  /* Beak line */
  ctx.strokeStyle = '#c0650a';
  ctx.beginPath();
  ctx.moveTo(15, 2.5);
  ctx.lineTo(23, 2.5);
  ctx.stroke();

  ctx.restore();
}

function drawPipe(pipe) {
  const x = pipe.x;
  const topH = pipe.topHeight;
  const bottomY = topH + PIPE_GAP;

  /* Top pipe shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(x + 4, 0, PIPE_WIDTH - 4, topH);

  /* Top pipe body */
  const topGrad = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
  topGrad.addColorStop(0, '#4a9e3d');
  topGrad.addColorStop(0.15, '#5fb84e');
  topGrad.addColorStop(0.5, '#5fb84e');
  topGrad.addColorStop(0.85, '#4a9e3d');
  topGrad.addColorStop(1, '#3d8532');
  ctx.fillStyle = topGrad;
  ctx.fillRect(x, 0, PIPE_WIDTH, topH);

  /* Top pipe cap */
  ctx.fillStyle = '#5fb84e';
  const capH = 26;
  const capW = PIPE_WIDTH + 8;
  const capX = x - 4;
  const capY = topH - capH;
  ctx.fillRect(capX, capY, capW, capH);
  ctx.fillStyle = '#4a9e3d';
  ctx.fillRect(capX + 2, capY + 2, capW - 4, 4);
  ctx.strokeStyle = '#337a2b';
  ctx.lineWidth = 1;
  ctx.strokeRect(capX, capY, capW, capH);

  /* Top pipe border */
  ctx.strokeStyle = '#337a2b';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, 0, PIPE_WIDTH, topH);

  /* Bottom pipe shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(x + 4, bottomY, PIPE_WIDTH - 4, PLAYGROUND_H - bottomY);

  /* Bottom pipe body */
  ctx.fillStyle = topGrad;
  ctx.fillRect(x, bottomY, PIPE_WIDTH, PLAYGROUND_H - bottomY);

  /* Bottom pipe cap */
  ctx.fillStyle = '#5fb84e';
  ctx.fillRect(capX, bottomY, capW, capH);
  ctx.fillStyle = '#4a9e3d';
  ctx.fillRect(capX + 2, bottomY + 6, capW - 4, 4);
  ctx.strokeStyle = '#337a2b';
  ctx.lineWidth = 1;
  ctx.strokeRect(capX, bottomY, capW, capH);

  /* Bottom pipe border */
  ctx.strokeStyle = '#337a2b';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, bottomY, PIPE_WIDTH, PLAYGROUND_H - bottomY);

  /* Highlight stripes */
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 8, 0, 4, topH - capH);
  ctx.fillRect(x + 8, bottomY + capH, 4, PLAYGROUND_H - bottomY - capH);
}

/* ===== GAME STATE ===== */
function resetGame() {
  bird = { x: 80, y: H / 3, vy: 0, rotation: 0, radius: 12 };
  pipes = [];
  score = 0;
  framesSincePipe = 0;
  gameRunning = false;
  gameOver = false;
  frameCount = 0;
}

function spawnPipe() {
  const minTop = 60;
  const maxTop = PLAYGROUND_H - PIPE_GAP - 60;
  const topHeight = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + 10, topHeight: topHeight, scored: false });
}

/* ===== GAME LOOP ===== */
function update() {
  if (!gameRunning) return;
  frameCount++;

  /* Bird physics */
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.min(Math.max(bird.vy * 3, -30), 70) * Math.PI / 180;

  /* Pipe spawning */
  framesSincePipe++;
  if (framesSincePipe >= PIPE_SPAWN_INTERVAL) {
    spawnPipe();
    framesSincePipe = 0;
  }

  /* Move pipes */
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    /* Score */
    if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
      pipes[i].scored = true;
      score++;
      scoreDisplay.textContent = score;
      scoreSound();
    }

    /* Remove off-screen pipes */
    if (pipes[i].x + PIPE_WIDTH < -10) {
      pipes.splice(i, 1);
    }
  }

  /* Collision detection */
  const birdLeft = bird.x - bird.radius;
  const birdRight = bird.x + bird.radius;
  const birdTop = bird.y - bird.radius;
  const birdBottom = bird.y + bird.radius;

  /* Ground collision */
  if (birdBottom >= PLAYGROUND_H) {
    bird.y = PLAYGROUND_H - bird.radius;
    endGame();
    return;
  }

  /* Ceiling */
  if (birdTop <= 0) {
    bird.y = bird.radius;
    bird.vy = 0;
  }

  /* Pipe collision */
  for (const pipe of pipes) {
    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + PIPE_WIDTH;
    const gapTop = pipe.topHeight;
    const gapBottom = pipe.topHeight + PIPE_GAP;

    if (birdRight > pipeLeft && birdLeft < pipeRight) {
      if (birdTop < gapTop || birdBottom > gapBottom) {
        endGame();
        return;
      }
    }
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();

  for (const pipe of pipes) {
    drawPipe(pipe);
  }

  drawGround();
  drawBird(bird.x, bird.y, bird.rotation, !gameOver);

  /* Score on screen during gameplay */
  if (gameRunning && !gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 4;
    ctx.strokeText(score, W / 2, 60);
    ctx.fillText(score, W / 2, 60);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
  gameRunning = true;
  startScreen.classList.remove('active');
  gameOverScreen.classList.remove('active');
  scoreDisplay.style.display = 'block';
  scoreDisplay.textContent = '0';
  jumpSound();
  if (musicPlaying) startMusic();
}

function endGame() {
  gameRunning = false;
  gameOver = true;
  hitSound();
  if (musicPlaying) stopMusic();

  scoreDisplay.style.display = 'none';

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappyBest', bestScore);
  }

  finalScoreEl.textContent = score;
  bestScoreEl.textContent = 'Best: ' + bestScore;

  setTimeout(() => {
    gameOverScreen.classList.add('active');
  }, 400);
}

function jump() {
  if (gameOver) return;
  if (!gameRunning) {
    startGame();
    return;
  }
  bird.vy = JUMP;
  jumpSound();
  /* Reset rotation */
  if (bird.vy > 0) bird.rotation = 0;
}

/* ===== EVENT LISTENERS ===== */
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

canvas.addEventListener('click', (e) => {
  e.preventDefault();
  jump();
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  jump();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});

musicToggle.addEventListener('click', () => {
  initAudio();
  if (musicPlaying) {
    stopMusic();
    musicToggle.innerHTML = '&#9835; Music: OFF';
  } else {
    if (gameRunning) {
      startMusic();
    }
    musicToggle.innerHTML = '&#9835; Music: ON';
  }
});

/* ===== INITIALIZE ===== */
resetGame();
/* Draw initial state */
frameCount = 0;
drawBackground();
drawGround();
drawBird(bird.x, bird.y, 0, true);
gameLoop();
</script>
</body>
</html>
